baseURL = 'https://frankliu1980.github.io/blog'

languageCode: en-us

title: Frank's tech world

copyright: © 2026-2027 Frank Liu

googleAnalytics:

pagination:
  pagerSize: 10
  # Specify the number of posts listed at home page

theme: hugo-theme-minima
# Specify a theme to use

defaultContentLanguage: en
# Specify the default language

languages:
# Override language-specific configurations
  en:
    languageName: EN
    weight: 1
    
  zh-cn:
    languageName: 简中
    weight: 2
    params:
      greet: 你好 :)
      author:
        status: 目前住在地球 🌍
        description: |
          这是我记录一些个人思考和学习记录的地方。

params:
# Define regular configurations

  greet: Hello :)
  
  subtitle:
  
  switch: ["🌚", "🌝"]
  
  defaultTheme: system
  # Specify the default color theme, available values: light, sand, rock, system.

  displayDate: true

  displayDescription: true

  selectable: true

  author:
    name: Frank Liu
    status: Currently living on Earth 🌍
    avatar: https://avatars.githubusercontent.com/u/33592375?v=4
    description: |
      This is my blog, a place where record my thinking and learning.

  social:
    - name: "email"
      url: "mailto:shmilyaw@hotmail.com"
    - name: "github"
      url: "https://github.com/frankliu1980"
    - name: "rss"
      url: "index.xml"

  math:
    enable: true
    provider: katex

  diagram:
    enable: true
    provider: mermaid

  comment:
    enable: true
    provider: giscus

    disqus:
    # See also https://disqus.com
      shortname: frank-blog

    utterances:
    # See also https://utteranc.es
      repo: mivinci/hugo-theme-minima
      issueTerm: pathname
      label: comment

    giscus: 
    # See also https://giscus.app
      repo: mivinci/hugo-theme-minima
      repoId: MDEwOlJlcG9zaXRvcnkzODcxMjM2NDU=
      category: Comments
      categoryId: DIC_kwDOFxMJvc4CScQm
      mapping: pathname
      inputPosition: buttom # bottom | top
      reactions: true
      metadata: false

  search:
    enable: true
    provider: fuse
    title: Search
    placeholder: Enter keywords

    fuse:
    # See also https://fusejs.io
      keys:
        - title
        - permalink
        - summary
        - content
      distance: 100
      location: 0
      threshold: 0.6
      ignoreLocation: false
      isCaseSensitive: false
      includeScore: false
      includeMatches: false
      minMatchCharLength: 1
      shouldSort: true
      findAllMatches: false

menu:
  main:
    - identifier: home
      name: Home
      weight: 1
    - identifier: tags
      name: Tags
      weight: 2
    - identifier: series
      name: Series
      weight: 3
    - identifier: search
      name: 🔍
      weight: 4

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
# **DO NOT EDIT** anything below. 
# Because unlike other Hugo themes, the way Minima uses to do syntax
# highlighting depends strongly on configurations below, so that the
# color theme of code blocks changes with the blog color theme, instead
# of being static like you may have seen on other Hugo themes.
  highlight:
    lineNos: true
    noClasses: false
