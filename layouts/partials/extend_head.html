{{ $noop := .Content }}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">

{{ if strings.Contains .Content "mermaid" }}
<style>
  .mermaid {
    width: 100%;
    max-width: 100%;
    height: 500px;
    overflow: auto;
    margin: 1.5rem 0;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    background: #fafafa;
    position: relative;
    cursor: grab;
  }
  .mermaid:active {
    cursor: grabbing;
  }
  .mermaid svg {
    max-width: none !important;
    height: auto;
    display: block;
  }
  .mermaid::after {
    content: "Ctrl/⌘ + 滚轮缩放 · 滚动条平移 · 双击重置";
    position: absolute;
    right: 8px;
    bottom: 6px;
    font-size: 12px;
    color: #aaa;
    pointer-events: none;
    background: rgba(255,255,255,0.7);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
{{ end }}
