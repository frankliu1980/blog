{{ if strings.Contains .Content "mermaid" }}
<script>
(function () {
  function init(el) {
    if (el.__mermaidInit) return;
    el.__mermaidInit = true;

    var svg = el.querySelector('svg');
    if (!svg) return;

    // 基准宽度 = 容器宽度（图会按这个宽度渲染，高度按比例自动撑开）
    var baseWidth = el.clientWidth;
    svg.style.width = baseWidth + 'px';
    svg.style.height = 'auto';
    svg.style.maxWidth = 'none';

    // 缩放比例（相对 baseWidth）
    var scale = 1;

    function applyScale() {
      svg.style.width = (baseWidth * scale) + 'px';
    }

    // Ctrl/Cmd + 滚轮 = 缩放；普通滚轮 = 滚动
    el.addEventListener('wheel', function (e) {
      if (!e.ctrlKey && !e.metaKey) {
        return;                 // 普通滚轮交给浏览器滚动
      }
      e.preventDefault();
      scale *= (e.deltaY > 0 ? 0.9 : 1.1);
      scale = Math.max(0.3, Math.min(5, scale));
      applyScale();
      console.log('[mermaid-zoom] scale =', scale.toFixed(2));
    }, { passive: false });

    // 双击重置
    el.addEventListener('dblclick', function () {
      scale = 1;
      applyScale();
      el.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    });

    // 窗口尺寸变化时重新计算
    window.addEventListener('resize', function () {
      baseWidth = el.clientWidth;
      applyScale();
    });

    console.log('[mermaid-zoom] initialized, baseWidth =', baseWidth);
  }

  function scan() {
    document.querySelectorAll('.mermaid').forEach(init);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scan);
  } else {
    scan();
  }
  setTimeout(scan, 300);
  setTimeout(scan, 1000);
})();
</script>
{{ end }}
